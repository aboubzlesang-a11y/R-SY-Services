<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R&amp;SY Services - Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #333333;
            background-color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Poppins', sans-serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background-color: #0F3D75;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo img {
            height: 125px;
            width: auto;
            display: block;
            object-fit: contain;
            margin: -15px 0;
            transition: transform 0.3s ease;
        }

        .logo img:hover {
            transform: scale(1.05);
        }

        /* Bouton Burger (Affiché sur tous les écrans) */
        .burger-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 1002;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .burger-btn:hover {
            color: #22A06B;
            transform: scale(1.1);
        }

        /* Menu Caché par défaut (Slide-in / Overlay) */
        nav ul#nav-list {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            height: 100vh;
            background-color: #0F3D75;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            list-style: none;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.3);
            transition: right 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 1001;
        }

        /* Classe activée via JS */
        nav ul#nav-list.active {
            right: 0;
        }

        nav a {
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: uppercase;
            transition: color 0.3s ease;
            color: #ffffff;
            position: relative;
        }

        nav a:hover,
        nav a.active {
            color: #22A06B;
        }

        .btn-nav {
            background-color: #22A06B;
            color: #fff !important;
            padding: 10px 18px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease !important;
        }

        .btn-nav:hover {
            background-color: #1b8256;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 160, 107, 0.3);
        }

        .contact-section {
            padding: 4rem 5%;
            max-width: 700px;
            margin: 0 auto;
            animation: fadeInUp 0.8s ease-out;
        }

        .contact-form {
            background: #F4F6FB;
            padding: 2rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-top: 4px solid #22A06B;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .contact-form:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(15, 61, 117, 0.08);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #0F3D75;
            box-shadow: 0 0 8px rgba(15, 61, 117, 0.2);
            transform: scale(1.01);
        }

        .btn-submit {
            background-color: #22A06B;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: all 0.5s ease;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            background-color: #1b8256;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 160, 107, 0.3);
        }

        footer {
            background-color: #0F3D75;
            color: #ffffff;
            padding-top: 2.5rem;
            margin-top: 4rem;
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5% 2rem 5%;
            flex-wrap: wrap;
            gap: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .footer-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }

        .footer-info:hover {
            transform: translateX(5px);
        }

        .footer-info i {
            font-size: 1.2rem;
            color: #ffffff;
            transition: color 0.3s ease;
        }

        .footer-info:hover i {
            color: #22A06B;
        }

        .footer-bottom {
            text-align: center;
            padding: 1rem 5%;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            <img src="colored-logo.png" alt="R&SY Services Logo">
        </a>
        <nav>
            <button class="burger-btn" id="burger-btn" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <ul id="nav-list">
                <li><a href="index.html">ACCUEIL</a></li>
                <li><a href="a-propos.html">À PROPOS</a></li>
                <li><a href="services.html">NOS SERVICES</a></li>
                <li><a href="boutique.html">BOUTIQUE</a></li>
                <li><a href="blog.html">BLOG</a></li>
                <li><a href="contact.html" class="active">CONTACT</a></li>
                <li><a href="contact.html" class="btn-nav">DEMANDER UN DEVIS</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact-section">
        <h1 style="color: #0F3D75; text-align: center; margin-bottom: 1rem;">Contact & Devis Gratuit</h1>

        <form class="contact-form">
            <div class="form-group">
                <label>Nom & Prénom *</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" required>
            </div>
            <div class="form-group">
                <label>Téléphone *</label>
                <input type="tel" required>
            </div>
            <div class="form-group">
                <label>Service concerné</label>
                <select>
                    <option>Nettoyage Professionnel</option>
                    <option>Conciergerie / Airbnb</option>
                    <option>Achat Produits d'entretien</option>
                    <option>Autre demande</option>
                </select>
            </div>
            <div class="form-group">
                <label>Message / Détails de votre besoin</label>
                <textarea rows="5"></textarea>
            </div>
            <button type="submit" class="btn-submit">ENVOYER MA DEMANDE</button>
        </form>
    </section>

    <footer>
        <div class="footer-top">
            <div class="footer-info">
                <i class="fa-solid fa-location-dot"></i>
                <div><strong>R&SY SERVICES</strong><br>Quartier Plateau, B.P. 10574, Niamey, Niger</div>
            </div>
            <div class="footer-info">
                <i class="fa-solid fa-phone"></i>
                <div><strong>+227 88 04 47 68</strong><br>contact@rsyservices.ne</div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 R&SY Services. Tous droits réservés.</p>
        </div>
    </footer>

    <script>
        const burgerBtn = document.getElementById('burger-btn');
        const navList = document.getElementById('nav-list');
        const burgerIcon = burgerBtn.querySelector('i');

        burgerBtn.addEventListener('click', () => {
            navList.classList.toggle('active');

            if (navList.classList.contains('active')) {
                burgerIcon.classList.remove('fa-bars');
                burgerIcon.classList.add('fa-xmark');
            } else {
                burgerIcon.classList.remove('fa-xmark');
                burgerIcon.classList.add('fa-bars');
            }
        });
    </script>

</body>

</html>
